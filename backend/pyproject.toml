[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regtrace-backend"
version = "0.1.0"
description = "RegTrace - agentic regulatory compliance intelligence (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.1",
    "httpx>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PL"]
# Complexity/magic-number rules are too noisy for scoring code whose constants are
# documented in place; S608 flags our parameterised SQL built from static fragments.
ignore = ["PLR0913", "PLR0917", "E501", "SIM102", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "S608", "S101", "RUF001", "RUF003", "ASYNC240", "SIM105", "RUF007", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"scripts/**" = ["T201", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = ["pymupdf.*", "pymupdf", "docx.*", "docx", "openpyxl.*", "openpyxl", "fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.ingestion.*"]
disallow_untyped_calls = false
